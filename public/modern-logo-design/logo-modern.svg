<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0444DC" />
      <stop offset="100%" stop-color="#3484F4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Abstract O (Outer Ring) -->
  <circle cx="256" cy="256" r="210" stroke="url(#logo_grad)" stroke-width="40" stroke-linecap="round" opacity="0.15" />
  <path d="M466 256C466 371.976 371.976 466 256 466C140.024 466 46 371.976 46 256C46 140.024 140.024 46 256 46" stroke="url(#logo_grad)" stroke-width="40" stroke-linecap="round" stroke-dasharray="600 1000" />

  <!-- Abstract X (Intersecting Data Flows) -->
  <g filter="url(#glow)">
    <!-- First stroke of X -->
    <path d="M160 160L352 352" stroke="url(#logo_grad)" stroke-width="50" stroke-linecap="round" />
    <!-- Second stroke of X -->
    <path d="M352 160L160 352" stroke="url(#logo_grad)" stroke-width="50" stroke-linecap="round" />
    
    <!-- Central Node (AI Hub) -->
    <circle cx="256" cy="256" r="45" fill="white" />
    <circle cx="256" cy="256" r="30" fill="url(#logo_grad)" />
  </g>
  
  <!-- Decorative Data Points -->
  <circle cx="160" cy="160" r="15" fill="url(#logo_grad)" />
  <circle cx="352" cy="352" r="15" fill="url(#logo_grad)" />
  <circle cx="352" cy="160" r="15" fill="url(#logo_grad)" />
  <circle cx="160" cy="352" r="15" fill="url(#logo_grad)" />
</svg>